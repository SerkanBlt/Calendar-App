<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Calendar Pro — takvim, görev ve proje planlama uygulaması" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <title>Calendar Pro</title>
    <script>
      // Tema yanıp sönmesini (FOUC) önlemek için JS modülleri yüklenmeden önce temayı uygula.
      (function () {
        try {
          var pref = localStorage.getItem('cp-theme') || 'dark';
          // Bilinmeyen bir değer gelirse CSS varsayılanı (koyu) uygulanır; theme.js sonradan doğrular.
          var theme = pref === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (/^[a-z-]+$/.test(pref) ? pref : 'dark');
          document.documentElement.setAttribute('data-theme', theme);

          // Arka plan görseli (bkz. src/core/backgrounds.js) — ilk boyamada uygulanır
          var bg = JSON.parse(localStorage.getItem('cp-bg') || 'null');
          if (bg && bg.src && /^[a-z0-9/_.-]+$/i.test(bg.src)) {
            var root = document.documentElement;
            root.setAttribute('data-bg', bg.value);
            root.style.setProperty('--app-bg-image', 'url("' + new URL(bg.src, document.baseURI).href + '")');
            root.style.setProperty('--app-bg-dim', (Number(bg.dim) || 0) + '%');
            // Yerleşim (Doldur/Sığdır/Uzat/Döşe/Ortala) — yalnızca beklenen CSS değerleri kabul edilir
            var safe = /^[a-z0-9% ]+$/i;
            if (safe.test(bg.size || '')) root.style.setProperty('--app-bg-size', bg.size);
            if (safe.test(bg.repeat || '')) root.style.setProperty('--app-bg-repeat', bg.repeat);
            if (safe.test(bg.position || '')) root.style.setProperty('--app-bg-position', bg.position);
          }
        } catch (e) { /* localStorage erişilemezse varsayılan koyu tema kalır */ }
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot-screen">Calendar Pro yükleniyor…</div>
    </div>
    <noscript>Calendar Pro'yu kullanmak için JavaScript'i etkinleştirin.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
