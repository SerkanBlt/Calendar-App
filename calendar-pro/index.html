<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Calendar Pro — takvim, görev ve proje planlama uygulaması" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <title>Calendar Pro</title>
    <script>
      // Tema yanıp sönmesini (FOUC) önlemek için JS modülleri yüklenmeden önce temayı uygula.
      (function () {
        try {
          var pref = localStorage.getItem('cp-theme') || 'dark';
          var theme = pref === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (['dark', 'light', 'autumn'].indexOf(pref) !== -1 ? pref : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* localStorage erişilemezse varsayılan koyu tema kalır */ }
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot-screen">Calendar Pro yükleniyor…</div>
    </div>
    <noscript>Calendar Pro'yu kullanmak için JavaScript'i etkinleştirin.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
